<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script>if(/^(biztech-web|zetabiz)(-mhtbiz)?\.vercel\.app$/.test(location.hostname))location.replace('https://mhtbiz.com'+location.pathname+location.search+location.hash);</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tài khoản doanh nghiệp – Zetabiz</title>
<link rel="icon" type="image/png" href="/assets/zetabiz-mark-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/admin/admin.css">
<style>
.ph{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.ph-in{max-width:1180px;margin:0 auto;padding:12px clamp(16px,3vw,28px);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ph .logo{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--text);text-decoration:none}
.ph .grow{flex:1}
.ph select{height:40px;border-radius:10px;border:1px solid var(--line-2);padding:0 10px;font:inherit;max-width:280px}
.wrap{max-width:1180px;margin:0 auto;padding:24px clamp(16px,3vw,28px) 60px;display:flex;flex-direction:column;gap:20px}
.auth{max-width:440px;margin:6vh auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:16px}
.auth h1{font-size:22px}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.plan{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:#fff}
.plan[aria-checked="true"]{border-color:var(--primary);background:var(--primary-soft)}
.plan b{font-size:15px}.plan .p{font:600 18px var(--mono)}.plan ul{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--text-2)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.mod{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.mod input{width:18px;height:18px;margin-top:2px}
.sum{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:12px;background:var(--bg)}
.sum b{font:600 20px var(--mono)}
.qr{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.qr img{width:220px;height:auto;border:1px solid var(--line);border-radius:12px}
.subcard{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.thread{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow-y:auto}
.bubble{max-width:82%;padding:10px 14px;border-radius:14px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.bubble small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.bubble.me{background:var(--primary-soft);align-self:flex-end}.bubble.staff{background:var(--bg);align-self:flex-start}
</style>
</head>
<body>
<div id="app"><div class="gate" role="status"><span class="spin" aria-hidden="true"></span>Đang tải…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/admin/config.js"></script>
<script src="/admin/app.js"></script>
<script src="/admin/xlsx-lite.js"></script>
<script src="/admin/finance-export.js"></script>
<script src="/admin/receipt-doc.js"></script>
<script>
(function () {
  'use strict';
  const sb = window.zbSb, h = BZ.h, fmt = BZ.fmt;
  const app = document.getElementById('app');
  const ROLE = { owner: 'Chủ doanh nghiệp', admin: 'Quản trị', billing: 'Phụ trách thanh toán', member: 'Thành viên', viewer: 'Chỉ xem' };
  const SUB = { trial: ['Dùng thử', 'info'], active: ['Đang hoạt động', 'ok'], past_due: ['Quá hạn thanh toán', 'warn'], suspended: ['Tạm ngưng', 'warn'], cancelled: ['Đã hủy', 'bad'], expired: ['Hết hạn', 'bad'] };
  const ORD = BZ.LABELS.order, PAY = BZ.LABELS.payment;
  const TK = { new: ['Mới gửi', 'info'], in_progress: ['Đang xử lý', 'blue'], waiting_customer: ['Chờ anh/chị phản hồi', 'warn'], resolved: ['Đã giải quyết', 'ok'], closed: ['Đã đóng', 'bad'] };
  const chip = function (m, v) { const x = m[v] || [v || '—', 'info']; return h('span', { class: 'chip ' + x[1] }, x[0]); };
  const money = function (n) { return n === null || n === undefined ? 'Báo giá riêng' : fmt.money(n); };
  let user = null, orgs = [], org = null, myRole = null, BANK = {};

  function clear() { app.textContent = ''; }
  function header() {
    const sel = h('select', { 'aria-label': 'Doanh nghiệp' }, orgs.map(function (o) { return h('option', { value: o.organization_id }, o.name); }));
    if (org) sel.value = org.id;
    sel.addEventListener('change', function () { localStorage.setItem('zb-org', sel.value); start(); });
    return h('header', { class: 'ph' }, h('div', { class: 'ph-in' },
      h('a', { class: 'logo', href: '/' }, h('img', { class: 'logo-mark', src: '/assets/zetabiz-mark-64.png', alt: '', width: 28, height: 29 }), h('span', { class: 'logo-word' }, 'Zetabiz')),
      h('span', { class: 'muted', style: { fontSize: '13px' } }, 'Tài khoản doanh nghiệp'), h('span', { class: 'grow' }),
      orgs.length > 1 ? sel : null, h('span', { class: 'muted', style: { fontSize: '13px' } }, user.email),
      h('button', { type: 'button', class: 'btn btn-ghost btn-sm', onclick: async function () { await sb.auth.signOut(); location.reload(); } }, 'Đăng xuất')));
  }

  /* ================= Đăng nhập / đăng ký ================= */
  function authView(mode) {
    clear();
    const email = h('input', { type: 'email', autocomplete: 'email', required: true });
    const pass = h('input', { type: 'password', autocomplete: mode === 'signup' ? 'new-password' : 'current-password' });
    const name = h('input', { type: 'text', autocomplete: 'name' });
    const msg = h('div', { class: 'msg err', role: 'alert', hidden: true });
    const ok = h('div', { class: 'msg ok', hidden: true });
    const T = { login: 'Đăng nhập', signup: 'Tạo tài khoản', forgot: 'Quên mật khẩu' };
    const btn = h('button', { type: 'submit', class: 'btn btn-primary' }, mode === 'login' ? 'Đăng nhập' : mode === 'signup' ? 'Tạo tài khoản' : 'Gửi link đặt lại mật khẩu');
    const form = h('form', { class: 'auth' },
      h('a', { class: 'logo', href: '/', style: { display: 'flex', alignItems: 'center', gap: '10px', textDecoration: 'none', color: 'var(--text)', fontWeight: '700' } }, h('img', { class: 'logo-mark', src: '/assets/zetabiz-mark-64.png', alt: '' }), h('span', { class: 'logo-word' }, 'Zetabiz')),
      h('h1', null, T[mode]), h('p', { class: 'muted', style: { fontSize: '14px' } }, mode === 'signup' ? 'Dành cho doanh nghiệp mua và quản lý dịch vụ Zetabiz. Nếu được đồng nghiệp mời, hãy đăng ký đúng email nhận lời mời.' : 'Quản lý gói dịch vụ, thanh toán, chứng từ và thành viên của doanh nghiệp.'),
      msg, ok, mode === 'signup' ? BZ.field('Họ và tên', name) : null, BZ.field('Email', email), mode !== 'forgot' ? BZ.field('Mật khẩu', pass, mode === 'signup' ? 'Ít nhất 8 ký tự' : null) : null, btn,
      h('div', { class: 'row-actions', style: { justifyContent: 'space-between', fontSize: '14px' } },
        mode !== 'login' ? h('button', { type: 'button', class: 'link-btn', onclick: function () { authView('login'); } }, 'Đã có tài khoản? Đăng nhập') : h('button', { type: 'button', class: 'link-btn', onclick: function () { authView('signup'); } }, 'Chưa có tài khoản? Đăng ký'),
        mode === 'login' ? h('button', { type: 'button', class: 'link-btn', onclick: function () { authView('forgot'); } }, 'Quên mật khẩu?') : null));
    form.addEventListener('submit', async function (e) {
      e.preventDefault(); msg.hidden = true; ok.hidden = true; btn.disabled = true;
      try {
        const em = email.value.trim().toLowerCase();
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) throw new Error('Email không hợp lệ.');
        if (mode === 'forgot') {
          const r = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin + '/tai-khoan/' }); if (r.error) throw r.error;
          ok.textContent = 'Đã gửi link đặt lại mật khẩu tới ' + em + '. Kiểm tra cả hộp thư rác.'; ok.hidden = false; return;
        }
        if (pass.value.length < (mode === 'signup' ? 8 : 1)) throw new Error(mode === 'signup' ? 'Mật khẩu ít nhất 8 ký tự.' : 'Nhập mật khẩu.');
        if (mode === 'signup') {
          const r = await sb.auth.signUp({ email: em, password: pass.value, options: { data: { full_name: name.value.trim() }, emailRedirectTo: location.origin + '/tai-khoan/' } });
          if (r.error) throw r.error;
          if (!r.data.session) { ok.textContent = 'Đã tạo tài khoản. Mở email ' + em + ' và bấm link xác nhận, rồi quay lại đây đăng nhập.'; ok.hidden = false; return; }
        } else {
          const r = await sb.auth.signInWithPassword({ email: em, password: pass.value });
          if (r.error) throw new Error(/invalid/i.test(r.error.message) ? 'Email hoặc mật khẩu không đúng.' : /confirm/i.test(r.error.message) ? 'Email chưa được xác nhận. Mở email và bấm link xác nhận trước.' : r.error.message);
        }
        start();
      } catch (err) { msg.textContent = BZ.errText(err); msg.hidden = false; } finally { btn.disabled = false; }
    });
    app.appendChild(form);
  }
  function resetView() {
    clear();
    const pass = h('input', { type: 'password', autocomplete: 'new-password' });
    const msg = h('div', { class: 'msg err', hidden: true });
    const form = h('form', { class: 'auth' }, h('h1', null, 'Đặt mật khẩu mới'), msg, BZ.field('Mật khẩu mới', pass, 'Ít nhất 8 ký tự'), h('button', { type: 'submit', class: 'btn btn-primary' }, 'Lưu mật khẩu'));
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      if (pass.value.length < 8) { msg.textContent = 'Mật khẩu ít nhất 8 ký tự.'; msg.hidden = false; return; }
      const r = await sb.auth.updateUser({ password: pass.value });
      if (r.error) { msg.textContent = BZ.errText(r.error); msg.hidden = false; return; }
      BZ.toast('Đã đổi mật khẩu.', 'ok'); history.replaceState(null, '', location.pathname); start();
    });
    app.appendChild(form);
  }

  /* ================= Tạo doanh nghiệp lần đầu ================= */
  function onboardView() {
    clear(); app.appendChild(header());
    const f = {}; ['name', 'tax_code', 'address', 'representative', 'phone', 'email'].forEach(function (k) { f[k] = h('input', { type: k === 'email' ? 'email' : 'text' }); });
    f.email.value = user.email;
    const body = h('div', { class: 'wrap' }, h('section', { class: 'card', style: { maxWidth: '720px' } },
      h('h1', { style: { fontSize: '22px', marginBottom: '6px' } }, 'Thông tin doanh nghiệp'),
      h('p', { class: 'muted', style: { marginBottom: '16px' } }, 'Khai một lần để mua dịch vụ và nhận chứng từ đúng tên công ty. Zetabiz xác minh trong giờ làm việc.'),
      h('div', { class: 'form-grid' }, h('div', { class: 'span2' }, BZ.field('Tên doanh nghiệp *', f.name)), BZ.field('Mã số thuế', f.tax_code), BZ.field('Người đại diện', f.representative),
        h('div', { class: 'span2' }, BZ.field('Địa chỉ', f.address)), BZ.field('Điện thoại', f.phone), BZ.field('Email nhận chứng từ', f.email)),
      h('div', { style: { marginTop: '16px' } }, h('button', { type: 'button', class: 'btn btn-primary', onclick: async function (e) {
        const b = e.currentTarget; b.disabled = true;
        try {
          const p = {}; Object.keys(f).forEach(function (k) { p[k] = f[k].value.trim(); }); p.full_name = (user.user_metadata && user.user_metadata.full_name) || '';
          await BZ.rpc('register_organization', { payload: p }); BZ.toast('Đã gửi thông tin doanh nghiệp.', 'ok'); start();
        } catch (err) { BZ.toast(BZ.errText(err), 'err'); } finally { b.disabled = false; }
      } }, 'Gửi thông tin'))));
    app.appendChild(body);
  }

  /* ================= Khung chính ================= */
  let tab = 'home';
  async function start() {
    const s = (await sb.auth.getSession()).data.session;
    if (!s) return authView('login');
    user = s.user;
    try { await BZ.rpc('accept_org_invites'); } catch (e) { /* không có lời mời thì bỏ qua */ }
    try { orgs = await BZ.rpc('my_organizations') || []; } catch (e) { orgs = []; }
    if (!orgs.length) return onboardView();
    const want = localStorage.getItem('zb-org');
    const pick = orgs.find(function (o) { return o.organization_id === want; }) || orgs[0];
    const r = await sb.from('organizations').select('*').eq('id', pick.organization_id).maybeSingle();
    org = r.data; myRole = pick.my_role;
    const b = await sb.from('settings').select('value').eq('key', 'bank').maybeSingle(); BANK = (b.data && b.data.value) || {};
    render();
  }
  const canManage = function () { return org && org.status === 'active' && (myRole === 'owner' || myRole === 'admin'); };
  const canPay = canManage; /* backend: đặt mua & thanh toán cần vai trò Chủ DN hoặc Quản trị */

  const TABS = [{ k: 'home', label: 'Tổng quan' }, { k: 'buy', label: 'Mua & gia hạn' }, { k: 'orders', label: 'Đơn hàng & thanh toán' }, { k: 'receipts', label: 'Chứng từ' },
    { k: 'members', label: 'Thành viên' }, { k: 'support', label: 'Hỗ trợ' }, { k: 'profile', label: 'Hồ sơ công ty' }];
  let pane;
  function go(k) { tab = k; history.replaceState(null, '', '#' + k); render(); }
  function render() {
    clear(); app.appendChild(header());
    const wrap = h('div', { class: 'wrap' });
    wrap.appendChild(h('div', { class: 'top' }, h('div', { class: 'grow' }, h('h1', null, org.name), h('p', { class: 'sub' }, 'Vai trò của anh/chị: ' + (ROLE[myRole] || myRole)))));
    if (org.status === 'pending_verification') wrap.appendChild(h('div', { class: 'msg info' }, h('b', null, 'Doanh nghiệp đang chờ Zetabiz xác minh. '), 'Trong lúc chờ, anh/chị xem được bảng giá nhưng chưa đặt mua hay mời thành viên. Cần gấp, gọi 0918 566 177.'));
    if (org.status === 'suspended') wrap.appendChild(h('div', { class: 'msg err' }, 'Doanh nghiệp đang bị tạm ngưng. Vui lòng liên hệ Zetabiz qua 0918 566 177.'));
    const bar = h('div', { class: 'tabs', role: 'tablist' }, TABS.map(function (t) { return h('button', { type: 'button', role: 'tab', 'aria-selected': t.k === tab ? 'true' : 'false', onclick: function () { if (location.hash.slice(1) === t.k) render(); else location.hash = t.k; } }, t.label); }));
    pane = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '20px' } });
    wrap.append(bar, pane); app.appendChild(wrap);
    ({ home: home, buy: buy, orders: orders, receipts: receipts, members: members, support: support, profile: profile })[tab]();
  }

  /* ---------- Tổng quan ---------- */
  async function home() {
    const r = await Promise.all([
      sb.from('subscriptions').select('*').eq('organization_id', org.id).order('current_period_end', { ascending: false }),
      sb.from('subscription_modules').select('*').eq('organization_id', org.id).order('created_at', { ascending: false }),
      sb.from('notifications').select('*').eq('audience', 'org').eq('organization_id', org.id).order('created_at', { ascending: false }).limit(8),
      sb.from('orders').select('id,order_code,total_amount,status').eq('organization_id', org.id).eq('status', 'pending_payment')
    ]);
    const subs = r[0].data || [], mods = r[1].data || [], notes = r[2].data || [], unpaid = r[3].data || [];
    const prodIds = Array.from(new Set(subs.map(function (s) { return s.product_id; }).filter(Boolean)));
    const prods = {};
    if (prodIds.length) { const p = await sb.from('products').select('id,app_url,name').in('id', prodIds); (p.data || []).forEach(function (x) { prods[x.id] = x; }); }
    if (unpaid.length) pane.appendChild(h('div', { class: 'msg info' }, 'Có ' + unpaid.length + ' đơn hàng chờ thanh toán. ', h('button', { type: 'button', class: 'link-btn', onclick: function () { go('orders'); } }, 'Thanh toán ngay ›')));
    pane.appendChild(h('section', { class: 'card' }, h('div', { class: 'card-h' }, h('h2', null, 'Gói dịch vụ'), h('button', { type: 'button', class: 'btn btn-primary btn-sm', onclick: function () { go('buy'); } }, '+ Mua / gia hạn')),
      subs.length ? h('div', { class: 'subs' }, subs.map(function (s) {
        const left = s.current_period_end ? Math.ceil((new Date(s.current_period_end) - new Date()) / 864e5) : null;
        const url = s.access_url || (prods[s.product_id] || {}).app_url;
        return h('div', { class: 'subcard' }, h('b', { style: { fontSize: '16px' } }, s.product_name || 'Dịch vụ'), h('span', { class: 'muted' }, (s.plan_name || '') + ' · ' + fmt.cycle(s.billing_cycle)),
          h('div', null, chip(SUB, s.status)),
          h('span', null, 'Hạn dùng: ', h('b', null, fmt.date(s.current_period_end)), left !== null && ['active', 'trial', 'past_due'].indexOf(s.status) >= 0 ? h('span', { class: left <= 14 ? 'neg' : 'muted' }, ' (còn ' + Math.max(0, left) + ' ngày)') : null),
          s.max_users ? h('span', { class: 'muted' }, 'Tối đa ' + s.max_users + ' nhân viên') : null,
          h('div', { class: 'row-actions', style: { marginTop: '6px' } },
            url && ['active', 'trial', 'past_due'].indexOf(s.status) >= 0 ? h('a', { class: 'btn btn-primary btn-sm', href: url, target: '_blank', rel: 'noopener' }, 'Vào ứng dụng') : null,
            canPay() && s.plan_id ? h('button', { type: 'button', class: 'btn btn-ghost btn-sm', onclick: function () { renew(s); } }, 'Gia hạn') : null));
      })) : h('p', { class: 'muted' }, 'Doanh nghiệp chưa có gói dịch vụ nào. Bấm "Mua / gia hạn" để chọn gói.')));
    if (mods.length) pane.appendChild(h('section', { class: 'card' }, h('div', { class: 'card-h' }, h('h2', null, 'Mô-đun mua thêm')),
      h('ul', { class: 'list-plain' }, mods.map(function (m) {
        const st = { pending_approval: ['Chờ Zetabiz kích hoạt', 'warn'], active: ['Đang dùng', 'ok'], rejected: ['Bị từ chối', 'bad'], trial: ['Dùng thử', 'info'], suspended: ['Tạm ngưng', 'warn'], expired: ['Hết hạn', 'bad'], cancelled: ['Đã hủy', 'bad'] };
        return h('li', null, h('span', null, h('b', { style: { fontFamily: 'var(--font)' } }, m.module_name), m.reject_reason ? h('small', { class: 'muted', style: { display: 'block' } }, 'Lý do: ' + m.reject_reason) : null),
          h('span', null, chip(st, m.status), m.current_period_end ? h('small', { class: 'muted', style: { marginLeft: '8px' } }, 'đến ' + fmt.date(m.current_period_end)) : null));
      }))));
    pane.appendChild(h('section', { class: 'card' }, h('div', { class: 'card-h' }, h('h2', null, 'Thông báo')),
      notes.length ? h('ul', { class: 'timeline' }, notes.map(function (n) { return h('li', null, h('b', null, n.title), n.body ? h('div', null, n.body) : null, h('small', null, fmt.dateTime(n.created_at))); }))
        : h('p', { class: 'muted' }, 'Chưa có thông báo.')));
  }

  /* Gia hạn = đặt lại đúng gói đang dùng */
  async function renew(s) {
    if (!(await BZ.confirm('Gia hạn ' + (s.product_name || ''), 'Tạo đơn gia hạn gói ' + (s.plan_name || '') + ' (' + fmt.cycle(s.billing_cycle) + '). Sau khi thanh toán và được duyệt, hạn dùng được cộng thêm một kỳ.', 'Tạo đơn gia hạn'))) return;
    try { const code = await BZ.rpc('place_order', { payload: { organization_id: org.id, plan_id: s.plan_id, contact_email: user.email, note: 'Gia hạn ' + (s.subscription_code || '') } }); afterOrder(code); }
    catch (e) { BZ.toast(BZ.errText(e), 'err'); }
  }
  async function afterOrder(code) {
    BZ.toast('Đã tạo đơn ' + code + '.', 'ok');
    const o = await sb.from('orders').select('*').eq('order_code', code).maybeSingle();
    go('orders');
    if (o.data) payDialog(o.data);
  }

  /* ---------- Mua & gia hạn ---------- */
  async function buy() {
    const r = await Promise.all([
      sb.from('products').select('id,name,code,tagline,sales_mode').eq('status', 'published').order('sort_order'),
      sb.from('product_plans').select('*').eq('is_active', true).order('sort_order'),
      sb.from('modules').select('id,product_id,name,description,price_amount,billing_cycle').eq('status', 'published').order('sort_order'),

      const cat = h('select', null, ['Hướng dẫn sử dụng', 'Báo lỗi', 'Thanh toán & gói', 'Yêu cầu báo giá', 'Khác'].map(function (x) { return h('option', null, x); }));
      const phone = h('input', { type: 'tel', value: org.phone || '' });
      BZ.modal({ title: 'Gửi yêu cầu hỗ trợ', wide: true, body: h('div', { class: 'form-grid' }, h('div', { class: 'span2' }, BZ.field('Tiêu đề *', subj)), BZ.field('Loại', cat), BZ.field('Số điện thoại liên hệ', phone),
        h('div', { class: 'span2' }, BZ.field('Nội dung *', body, 'Mô tả cụ thể: đang làm gì, thấy gì, mong muốn gì'))),
        actions: [{ label: 'Hủy', kind: 'ghost' }, { label: 'Gửi', kind: 'primary', onClick: async function (c) {
          const code = await BZ.rpc('support_create_ticket', { payload: { organization_id: org.id, subject: subj.value, body: body.value, category: cat.value, contact_name: (user.user_metadata && user.user_metadata.full_name) || user.email, contact_email: user.email, contact_phone: phone.value } });
          c(); BZ.toast('Đã gửi yêu cầu ' + code + '.', 'ok'); render();
        } }] });
    }
    async function openTicket(t) {
      const m = await sb.from('support_ticket_messages').select('*').eq('ticket_id', t.id).order('created_at');
      const thread = h('div', { class: 'thread' }, (m.data || []).map(function (x) { return h('div', { class: 'bubble ' + (x.is_staff ? 'staff' : 'me') }, x.body, h('small', null, (x.is_staff ? (x.author_name || 'Zetabiz') : (x.author_name || 'Anh/chị')) + ' · ' + fmt.dateTime(x.created_at))); }));
      const rep = h('textarea', { rows: '3', maxlength: '5000', placeholder: 'Nhập phản hồi…' });
      const closed = t.status === 'closed';
      BZ.modal({ title: t.ticket_code + ' · ' + t.subject, wide: true, body: h('div', { style: { display: 'grid', gap: '14px' } }, chip(TK, t.status), thread, closed ? h('p', { class: 'muted' }, 'Yêu cầu đã đóng. Gửi yêu cầu mới nếu cần.') : BZ.field('Phản hồi', rep)),
        actions: [{ label: 'Đóng', kind: 'ghost' }].concat(closed ? [] : [{ label: 'Gửi phản hồi', kind: 'primary', onClick: async function (c, msg) {
          if (rep.value.trim().length < 2) { msg.textContent = 'Nhập nội dung.'; msg.hidden = false; return; }
          const r2 = await sb.from('support_ticket_messages').insert({ ticket_id: t.id, author_id: user.id, author_name: (user.user_metadata && user.user_metadata.full_name) || user.email, is_staff: false, body: rep.value.trim() });
          if (r2.error) throw r2.error; c(); BZ.toast('Đã gửi phản hồi.', 'ok'); render();
        } }]) });
      setTimeout(function () { thread.scrollTop = thread.scrollHeight; }, 50);
    }
  }

  /* ---------- Hồ sơ công ty ---------- */
  function profile() {
    const f = {}; ['name', 'tax_code', 'address', 'representative', 'phone', 'email'].forEach(function (k) { f[k] = h('input', { type: k === 'email' ? 'email' : 'text', value: org[k] || '', disabled: canManage() ? null : true }); });
    pane.appendChild(h('section', { class: 'card', style: { maxWidth: '760px' } }, h('div', { class: 'form-grid' },
      h('div', { class: 'span2' }, BZ.field('Tên doanh nghiệp', f.name)), BZ.field('Mã số thuế', f.tax_code), BZ.field('Người đại diện', f.representative),
      h('div', { class: 'span2' }, BZ.field('Địa chỉ', f.address)), BZ.field('Điện thoại', f.phone), BZ.field('Email nhận chứng từ', f.email)),
      h('div', { style: { marginTop: '16px' } }, canManage() ? h('button', { type: 'button', class: 'btn btn-primary', onclick: async function () {
        try { const p = { organization_id: org.id }; Object.keys(f).forEach(function (k) { p[k] = f[k].value.trim(); }); await BZ.rpc('org_update_profile', { payload: p }); BZ.toast('Đã lưu hồ sơ.', 'ok'); start(); } catch (e) { BZ.toast(BZ.errText(e), 'err'); }
      } }, 'Lưu hồ sơ') : h('p', { class: 'muted' }, 'Chỉ Chủ doanh nghiệp hoặc Quản trị sửa được hồ sơ.'))));
  }

  /* ---------- Khởi động ---------- */
  const hk = location.hash.slice(1);
  if (TABS.some(function (t) { return t.k === hk; })) tab = hk;
  window.addEventListener('hashchange', function () {
    const k = location.hash.slice(1);
    if (org && k !== tab && TABS.some(function (t) { return t.k === k; })) { tab = k; render(); }
  });
  sb.auth.onAuthStateChange(function (ev) { if (ev === 'PASSWORD_RECOVERY') resetView(); });
  if (/type=recovery/.test(location.hash)) resetView(); else start();
})();
</script>
</body>
</html>
