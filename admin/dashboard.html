<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script>if(/^(biztech-web|zetabiz)(-mhtbiz)?\.vercel\.app$/.test(location.hostname))location.replace('https://mhtbiz.com'+location.pathname+location.search+location.hash);</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tổng quan – Quản trị Zetabiz</title>
<link rel="icon" type="image/png" href="/assets/zetabiz-mark-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body data-page="dashboard">
<main id="main"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/admin/config.js"></script>
<script src="/admin/app.js"></script>
<script>
BZ.boot(async function (ctx) {
  const h = BZ.h, fmt = BZ.fmt, sb = ctx.sb, main = ctx.main;
  const today = new Date().toLocaleDateString('vi-VN', { weekday: 'long', day: 'numeric', month: 'numeric', year: 'numeric' });
  main.appendChild(BZ.pageHead('Xin chào, ' + ctx.name, today));

  function kpi(iconKey, label, id, note) {
    return h('div', { class: 'kpi' }, BZ.icon3d(iconKey, true), h('div', null, h('small', null, label), h('b', { id: id }, '—'), h('em', { id: id + '-n' }, note || '')));
  }
  main.appendChild(h('section', { class: 'kpis', 'aria-label': 'Số liệu chính' },
    kpi('leads', 'Khách tiềm năng mới (tháng)', 'k-leads'),
    kpi('orders', 'Báo giá chờ thanh toán', 'k-orders'),
    kpi('payments', 'Thanh toán chờ đối soát', 'k-pay'),
    kpi('subscriptions', 'Gói đang hoạt động', 'k-subs')
  ));

  const leadsBody = h('tbody', null, BZ.emptyRow(5, 'Đang tải…'));
  const todo = h('ul', { class: 'timeline' });
  main.appendChild(h('div', { class: 'grid2' },
    h('section', { class: 'card' },
      h('div', { class: 'card-h' }, h('h2', null, BZ.icon3d('leads'), 'Khách tiềm năng mới nhất'), h('a', { class: 'btn btn-ghost btn-sm', href: '/admin/leads.html' }, 'Xem tất cả')),
      h('div', { class: 'table-wrap' }, h('table', { class: 't' },
        h('thead', null, h('tr', null, ['Khách hàng', 'Quan tâm', 'Nguồn', 'Trạng thái', 'Ngày'].map(function (t) { return h('th', null, t); }))),
        leadsBody))),
    h('section', { class: 'card' }, h('div', { class: 'card-h' }, h('h2', null, BZ.icon3d('dashboard'), 'Việc cần làm hôm nay')), todo)
  ));

  async function count(table, build) {
    let q = sb.from(table).select('id', { count: 'exact', head: true });
    if (build) q = build(q);
    const r = await q; return r.error ? null : r.count;
  }
  const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0, 0, 0, 0);
  const nowIso = new Date().toISOString();
  const [lMonth, lNew, oPend, pSub, sAct, lFollow] = await Promise.all([
    count('leads', function (q) { return q.gte('created_at', monthStart.toISOString()); }),
    count('leads', function (q) { return q.eq('status', 'new'); }),
    count('orders', function (q) { return q.eq('status', 'pending_payment'); }),
    count('payments', function (q) { return q.eq('status', 'submitted'); }),
    count('subscriptions', function (q) { return q.in('status', ['trial', 'active']); }),
    count('leads', function (q) { return q.lte('next_follow_up_at', nowIso).not('status', 'in', '(won,lost)'); })
  ]);
  document.getElementById('k-leads').textContent = fmt.num(lMonth);
  document.getElementById('k-leads-n').textContent = lNew ? lNew + ' khách chưa liên hệ' : 'Không có khách chờ liên hệ';
  document.getElementById('k-orders').textContent = fmt.num(oPend);
  document.getElementById('k-pay').textContent = fmt.num(pSub);
  document.getElementById('k-subs').textContent = fmt.num(sAct);

  function task(n, text, href, cta) {
    if (!n) return null;
    return h('li', null, h('b', null, text.replace('{n}', n)), h('small', null, h('a', { href: href }, cta)));
  }
  const tasks = [
    task(lNew, '{n} khách tiềm năng mới chưa được liên hệ', '/admin/leads.html#new', 'Mở danh sách khách mới'),
    task(lFollow, '{n} khách đã đến hạn gọi lại', '/admin/leads.html#follow', 'Xem khách cần gọi lại'),
    task(pSub, '{n} khoản thanh toán chờ kế toán đối soát', '/admin/payments.html', 'Đối soát ngay'),
    task(oPend, '{n} báo giá đang chờ khách thanh toán', '/admin/orders.html', 'Xem báo giá')
  ].filter(Boolean);
  if (!tasks.length) tasks.push(h('li', null, h('b', null, 'Không có việc tồn đọng.'), h('small', null, 'Khách mới từ trang chủ sẽ hiện ở đây.')));
  tasks.forEach(function (t) { todo.appendChild(t); });

  const list = await sb.from('leads').select('full_name,company,interest,source,status,created_at').order('created_at', { ascending: false }).limit(8);
  leadsBody.textContent = '';
  if (list.error) leadsBody.appendChild(BZ.emptyRow(5, BZ.errText(list.error)));
  else if (!list.data.length) leadsBody.appendChild(BZ.emptyRow(5, 'Chưa có khách tiềm năng. Khi khách để lại thông tin trên trang chủ, họ sẽ xuất hiện ở đây.'));
  else list.data.forEach(function (l) {
    leadsBody.appendChild(h('tr', { class: 'clickable', onclick: function () { location.href = '/admin/leads.html'; } },
      h('td', null, l.full_name, l.company ? h('small', null, l.company) : null),
      h('td', null, l.interest || '—'), h('td', null, l.source || '—'),
      h('td', null, BZ.chip('lead', l.status)), h('td', null, fmt.date(l.created_at))));
  });
});
</script>
</body>
</html>
