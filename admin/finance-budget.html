<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script>if(/^(biztech-web|zetabiz)(-mhtbiz)?\.vercel\.app$/.test(location.hostname))location.replace('https://mhtbiz.com'+location.pathname+location.search+location.hash);</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Chi phí & ngân sách – Quản trị Zetabiz</title>
<link rel="icon" type="image/png" href="/assets/zetabiz-mark-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/admin/admin.css">
<style>
tr.root td{background:#F8FAFD;font-weight:600}
tr.child td:first-child{padding-left:28px}
.delta{font:500 12px var(--mono)}
</style>
</head>
<body data-page="budget">
<main id="main"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/admin/config.js"></script>
<script src="/admin/app.js"></script>
<script src="/admin/finance.js"></script>
<script>
BZ.boot(async function (ctx) {
  const h = BZ.h, sb = ctx.sb, main = ctx.main, vnd = FIN.vnd, fmt = BZ.fmt;
  main.appendChild(BZ.pageHead('Chi phí & ngân sách', 'Đặt ngân sách theo tháng, quý, năm; xem chi phí theo danh mục; quản lý danh mục thu chi và các mảng tính lãi lỗ.'));
  if (!FIN.guard(ctx)) return;
  await FIN.loadLookups();
  const can = ctx.can.finance;

  const TABS = [{ k: 'budgets', label: 'Ngân sách' }, { k: 'costs', label: 'Chi phí theo danh mục' }, { k: 'categories', label: 'Danh mục thu – chi' }, { k: 'centers', label: 'Mảng / bộ phận' }];
  const panes = {}; let current;
  const tabBtns = TABS.map(function (t) { panes[t.k] = h('div', { hidden: true }); return h('button', { type: 'button', role: 'tab', onclick: function () { show(t.k); } }, t.label); });
  main.appendChild(h('section', { class: 'card' }, h('div', { class: 'tabs', role: 'tablist' }, tabBtns), TABS.map(function (t) { return panes[t.k]; })));
  function show(k) {
    current = k; history.replaceState(null, '', '#' + k);
    TABS.forEach(function (t, i) { tabBtns[i].setAttribute('aria-selected', t.k === k ? 'true' : 'false'); panes[t.k].hidden = t.k !== k; });
    ({ budgets: loadBudgets, costs: loadCosts, categories: loadCategories, centers: loadCenters })[k]();
  }
  function refresh() { FIN.loadLookups().then(function () { show(current); }); }
  const PT = { month: 'Tháng', quarter: 'Quý', year: 'Năm' };

  function periodLabel(b) {
    const d = new Date(b.period_start);
    if (b.period_type === 'month') return 'Tháng ' + (d.getMonth() + 1) + '/' + d.getFullYear();
    if (b.period_type === 'quarter') return 'Quý ' + (Math.floor(d.getMonth() / 3) + 1) + '/' + d.getFullYear();
    return 'Năm ' + d.getFullYear();
  }
  /* Kỳ ngân sách: chọn loại + tháng bắt đầu, tự tính ngày cuối (quý/năm làm tròn về đầu quý/đầu năm) */
  function periodOf(type, ym) {
    const p = ym.split('-').map(Number); let y = p[0], m = p[1] - 1;
    if (type === 'quarter') m = Math.floor(m / 3) * 3;
    if (type === 'year') m = 0;
    const len = type === 'month' ? 1 : type === 'quarter' ? 3 : 12;
    return [FIN.iso(new Date(y, m, 1)), FIN.iso(new Date(y, m + len, 0))];
  }

  /* ================= Ngân sách ================= */
  const bMonth = h('input', { type: 'month', value: FIN.thisMonth(), 'aria-label': 'Xem ngân sách áp dụng trong tháng' });
  const bInactive = h('input', { type: 'checkbox' });
  bMonth.addEventListener('change', loadBudgets); bInactive.addEventListener('change', loadBudgets);
  const bBox = h('div');
  panes.budgets.append(h('div', { class: 'toolbar', style: { margin: '14px 0' } },
    h('label', { class: 'check' }, 'Áp dụng trong tháng ', bMonth), h('label', { class: 'check' }, bInactive, ' Hiện cả ngân sách đã ngưng'),
    h('span', { style: { flex: '1' } }),
    can ? h('button', { type: 'button', class: 'btn btn-ghost btn-sm', onclick: copyPrev }, 'Chép ngân sách tháng trước') : null,
    can ? h('button', { type: 'button', class: 'btn btn-primary btn-sm', onclick: function () { budgetForm(); } }, '+ Đặt ngân sách') : null), bBox);

  async function loadBudgets() {
    bBox.textContent = ''; bBox.appendChild(h('p', { class: 'muted' }, 'Đang tải…'));
    const rg = FIN.monthRange(bMonth.value || FIN.thisMonth());
    let q = sb.from('finance_budget_actuals').select('*').lte('period_start', rg[1]).gte('period_end', rg[0]).order('period_type').order('name');
    if (!bInactive.checked) q = q.eq('is_active', true);
    const r = await q;
    bBox.textContent = '';
    if (r.error) { bBox.appendChild(h('div', { class: 'msg err' }, BZ.errText(r.error))); return; }
    if (!r.data.length) { bBox.appendChild(h('p', { class: 'empty' }, 'Chưa có ngân sách nào áp dụng trong tháng này. Ví dụ: "Quảng cáo trả phí – 15 triệu/tháng", "Hosting & phần mềm – 5 triệu/tháng".')); return; }
    let tb = 0, ta = 0;
    r.data.forEach(function (b) { if (b.is_active) { tb += Number(b.amount); ta += Number(b.actual_amount); } });
    bBox.append(
      h('div', { class: 'kpis', style: { marginBottom: '16px' } },
        h('div', { class: 'kpi' }, h('div', null, h('small', null, 'Tổng ngân sách'), h('b', null, FIN.short(tb)), h('em', null, vnd(tb)))),
        h('div', { class: 'kpi' }, h('div', null, h('small', null, 'Đã chi'), h('b', { class: ta > tb ? 'neg' : null }, FIN.short(ta)), h('em', null, tb ? Math.round(ta / tb * 100) + '% ngân sách' : ''))),
        h('div', { class: 'kpi' }, h('div', null, h('small', null, 'Còn lại'), h('b', { class: tb - ta < 0 ? 'neg' : 'pos' }, FIN.short(tb - ta)), h('em', null, vnd(tb - ta))))),
      h('div', { class: 'table-wrap' }, h('table', { class: 't', style: { minWidth: '980px' } },
        h('thead', null, h('tr', null, ['Ngân sách', 'Kỳ', 'Áp dụng cho', 'Ngân sách', 'Đã chi', 'Còn lại', 'Mức dùng', ''].map(function (x, i) { return h('th', { style: i >= 3 && i <= 5 ? { textAlign: 'right' } : null }, x); }))),
        h('tbody', null, r.data.map(function (b) {
          const left = Number(b.amount) - Number(b.actual_amount), pct = Math.round(Number(b.actual_amount) / Number(b.amount) * 100);
          return h('tr', { style: b.is_active ? null : { opacity: '.55' } },
            h('td', null, h('b', null, b.name), b.is_active ? null : h('small', null, 'Đã ngưng')), h('td', null, periodLabel(b)),
            h('td', null, FIN.catLabel(b.category_id) || 'Mọi khoản chi', h('small', null, FIN.nameOf(b.cost_center_id) || 'Mọi mảng')),
            h('td', { class: 'num' }, vnd(b.amount)), h('td', { class: 'num' }, vnd(b.actual_amount)), h('td', { class: 'num ' + (left < 0 ? 'neg' : '') }, vnd(left)),
            h('td', { style: { minWidth: '150px' } }, FIN.budgetBar(Number(b.actual_amount), Number(b.amount), Number(b.warn_threshold)),
              h('small', { class: pct >= 100 ? 'neg' : null }, pct + '%' + (pct >= 100 ? ' · Vượt ngân sách' : pct >= Number(b.warn_threshold) ? ' · Sắp chạm mức' : ''))),
            h('td', null, can ? h('button', { type: 'button', class: 'btn btn-ghost btn-sm', onclick: function () { budgetForm(b); } }, 'Sửa') : null));
        })))),
      h('p', { class: 'muted', style: { fontSize: '13px', marginTop: '10px' } }, 'Đã chi = phiếu chi đã thực hiện, có ngày chứng từ trong kỳ, đúng danh mục và mảng của ngân sách. Ngân sách đặt cho nhóm danh mục sẽ tính cả các mục con trong nhóm.'));
  }

  async function budgetForm(b) {
    b = b ? Object.assign({}, b, { id: b.budget_id }) : {};
    const name = h('input', { type: 'text', maxlength: '150', value: b.name || '', placeholder: 'VD: Quảng cáo Facebook tháng 11' });
    const type = FIN.selectEl(Object.keys(PT).map(function (k) { return { value: k, label: PT[k] }; }), b.period_type || 'month');
    const start = h('input', { type: 'month', value: b.period_start ? b.period_start.slice(0, 7) : (bMonth.value || FIN.thisMonth()) });
    const cat = FIN.categorySelect('expense', b.category_id || '');
    cat.querySelector('option').textContent = '— Mọi khoản chi —';
    const cc = FIN.centerSelect(b.cost_center_id || ''); cc.querySelector('option').textContent = '— Mọi mảng —';
    const amount = FIN.moneyInput(b.amount || 0);
    const warn = h('input', { type: 'number', min: '1', max: '100', value: b.warn_threshold || 80 });
    const note = h('textarea', { maxlength: '1000' }, b.note || '');
    const active = h('input', { type: 'checkbox', checked: b.id ? b.is_active : true });
    const prev = h('p', { class: 'muted', style: { fontSize: '13px' } });
    function upd() { if (start.value) { const p = periodOf(type.value, start.value); prev.textContent = 'Áp dụng từ ' + fmt.date(p[0]) + ' đến ' + fmt.date(p[1]); } }
    type.addEventListener('change', upd); start.addEventListener('change', upd); upd();
    BZ.modal({ title: b.id ? 'Sửa ngân sách' : 'Đặt ngân sách', wide: true, body: h('div', { class: 'form-grid' },
      h('div', { class: 'span2' }, BZ.field('Tên ngân sách *', name)), BZ.field('Theo', type), BZ.field('Bắt đầu từ tháng', start),
      h('div', { class: 'span2' }, prev), BZ.field('Danh mục chi', cat), BZ.field('Mảng / bộ phận', cc),
      BZ.field('Mức ngân sách (đ) *', amount), BZ.field('Cảnh báo khi dùng tới (%)', warn),
      h('div', { class: 'span2' }, BZ.field('Ghi chú', note)),
      b.id ? h('label', { class: 'span2 check' }, active, ' Đang áp dụng') : null),
      actions: [{ label: 'Hủy', kind: 'ghost' }, { label: 'Lưu', kind: 'primary', onClick: async function (close, msg) {
        const w = Number(warn.value);
        const err = name.value.trim().length < 2 ? 'Nhập tên ngân sách.' : !start.value ? 'Chọn tháng bắt đầu.' : !amount.amount() ? 'Nhập mức ngân sách.' : !(w > 0 && w <= 100) ? 'Mức cảnh báo từ 1 đến 100%.' : null;
        if (err) { msg.textContent = err; msg.hidden = false; return; }
        const p = periodOf(type.value, start.value);
        const row = { name: name.value.trim(), period_type: type.value, period_start: p[0], period_end: p[1], category_id: cat.value || null,
          cost_center_id: cc.value || null, amount: amount.amount(), warn_threshold: w, note: note.value.trim() || null, is_active: active.checked };
        const r = b.id ? await sb.from('finance_budgets').update(row).eq('id', b.id) : await sb.from('finance_budgets').insert(row);
        if (r.error) throw r.error;
        close(); BZ.toast('Đã lưu ngân sách.', 'ok'); loadBudgets();
      } }] });
  }

  /* Chép các ngân sách THÁNG của tháng trước sang tháng đang xem (bỏ qua cái đã có cùng tên) */
  async function copyPrev() {
    const cur = bMonth.value || FIN.thisMonth(); const p = cur.split('-').map(Number);
    const prevM = FIN.iso(new Date(p[0], p[1] - 2, 1)).slice(0, 7);
    const pr = FIN.monthRange(prevM), cr = FIN.monthRange(cur);
    const a = await sb.from('finance_budgets').select('*').eq('period_type', 'month').eq('period_start', pr[0]).eq('is_active', true);
    const b = await sb.from('finance_budgets').select('name').eq('period_type', 'month').eq('period_start', cr[0]);
    if (a.error || b.error) return BZ.toast(BZ.errText(a.error || b.error), 'err');
    const have = new Set(b.data.map(function (x) { return x.name; }));
    const rows = a.data.filter(function (x) { return !have.has(x.name); }).map(function (x) {
      return { name: x.name, period_type: 'month', period_start: cr[0], period_end: cr[1], category_id: x.category_id, cost_center_id: x.cost_center_id, amount: x.amount, warn_threshold: x.warn_threshold, note: x.note };
    });
    if (!rows.length) return BZ.toast(a.data.length ? 'Các ngân sách tháng trước đã có ở tháng này.' : 'Tháng trước không có ngân sách theo tháng để chép.', 'ok');
    if (!(await BZ.confirm('Chép ngân sách', 'Chép ' + rows.length + ' ngân sách từ tháng ' + prevM.split('-').reverse().join('/') + ' sang tháng ' + cur.split('-').reverse().join('/') + '?', 'Chép'))) return;
    const r = await sb.from('finance_budgets').insert(rows);
    if (r.error) return BZ.toast(BZ.errText(r.error), 'err');
    BZ.toast('Đã chép ' + rows.length + ' ngân sách.', 'ok'); loadBudgets();
  }

  /* ================= Chi phí theo danh mục ================= */
  const cMonth = h('input', { type: 'month', value: FIN.thisMonth(), 'aria-label': 'Tháng' });
  const cCenter = FIN.centerSelect(''); cCenter.querySelector('option').textContent = 'Mọi mảng'; cCenter.setAttribute('aria-label', 'Mảng');
  cMonth.addEventListener('change', loadCosts); cCenter.addEventListener('change', loadCosts);
  const cBox = h('div');
  panes.costs.append(h('div', { class: 'toolbar', style: { margin: '14px 0' } }, cMonth, cCenter), cBox);
  async function loadCosts() {
    cBox.textContent = ''; cBox.appendChild(h('p', { class: 'muted' }, 'Đang tải…'));
    const cur = cMonth.value || FIN.thisMonth(); const p = cur.split('-').map(Number);
    const prevM = FIN.iso(new Date(p[0], p[1] - 2, 1)).slice(0, 7);
    const rg = [FIN.monthRange(prevM)[0], FIN.monthRange(cur)[1]], mid = FIN.monthRange(cur)[0];
    let q = sb.from('finance_transactions').select('category_id,amount,doc_date').eq('status', 'paid').eq('tx_type', 'payment').gte('doc_date', rg[0]).lte('doc_date', rg[1]).limit(10000);
    if (cCenter.value) q = q.eq('cost_center_id', cCenter.value);
    const r = await q;
    cBox.textContent = '';
    if (r.error) { cBox.appendChild(h('div', { class: 'msg err' }, BZ.errText(r.error))); return; }
    const now = {}, before = {};
    r.data.forEach(function (t) { const m = t.doc_date >= mid ? now : before; const k = t.category_id || 'none'; m[k] = (m[k] || 0) + Number(t.amount); });
    const roots = FIN.L.categories.filter(function (c) { return c.kind === 'expense' && !c.parent_id; });
    function sumOf(map, root) { let s = map[root.id] || 0; FIN.L.categories.forEach(function (c) { if (c.parent_id === root.id) s += map[c.id] || 0; }); return s; }
    let total = 0, totalPrev = 0;
    const rows = [];
    roots.forEach(function (rt) {
      const a = sumOf(now, rt), b = sumOf(before, rt); total += a; totalPrev += b;
      if (!a && !b) return;
      rows.push({ root: true, name: rt.name, a: a, b: b });
      if (now[rt.id] || before[rt.id]) rows.push({ name: rt.name + ' (chung)', a: now[rt.id] || 0, b: before[rt.id] || 0 });
      FIN.L.categories.filter(function (c) { return c.parent_id === rt.id; }).forEach(function (c) { if (now[c.id] || before[c.id]) rows.push({ name: c.name, a: now[c.id] || 0, b: before[c.id] || 0 }); });
    });
    if (now.none || before.none) { rows.push({ root: true, name: 'Chưa phân loại', a: now.none || 0, b: before.none || 0 }); total += now.none || 0; totalPrev += before.none || 0; }
    if (!rows.length) { cBox.appendChild(h('p', { class: 'empty' }, 'Không có khoản chi nào đã thực hiện trong tháng này và tháng trước.')); return; }
    function delta(a, b) {
      if (!b) return a ? h('span', { class: 'delta muted' }, 'mới') : '';
      const d = Math.round((a - b) / b * 100);
      return h('span', { class: 'delta ' + (d > 0 ? 'neg' : d < 0 ? 'pos' : 'muted') }, (d > 0 ? '+' : '') + d + '%');
    }
    cBox.append(h('div', { class: 'table-wrap' }, h('table', { class: 't' },
      h('thead', null, h('tr', null, ['Danh mục', 'Tháng này', 'Tỷ trọng', 'Tháng trước', 'So với tháng trước'].map(function (x, i) { return h('th', { style: i ? { textAlign: 'right' } : null }, x); }))),
      h('tbody', null, rows.map(function (x) {
        return h('tr', { class: x.root ? 'root' : 'child' }, h('td', null, x.name), h('td', { class: 'num' }, vnd(x.a)),
          h('td', { class: 'num' }, total ? Math.round(x.a / total * 100) + '%' : '—'), h('td', { class: 'num' }, vnd(x.b)), h('td', { class: 'num' }, delta(x.a, x.b)));
      }), h('tr', { class: 'root' }, h('td', null, 'Tổng chi'), h('td', { class: 'num' }, vnd(total)), h('td', { class: 'num' }, '100%'), h('td', { class: 'num' }, vnd(totalPrev)), h('td', { class: 'num' }, delta(total, totalPrev)))))));
  }

  /* ================= Danh mục ================= */
  function codeFrom(name, parentCode, kind) {
    const base = name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toUpperCase().replace(/[^A-Z0-9]+/g, '').slice(0, 14) || 'MUC';
    let code = (parentCode || (kind === 'income' ? 'THU' : 'CHI')) + '-' + base, n = 1;
    const used = new Set(FIN.L.categories.map(function (c) { return c.code; }));
    while (used.has(code)) code = (parentCode || (kind === 'income' ? 'THU' : 'CHI')) + '-' + base + (++n);
    return code.slice(0, 40);
  }
  function categoryForm(c, kind, parentId) {
    c = c || {}; kind = c.kind || kind;
    const name = h('input', { type: 'text', maxlength: '150', value: c.name || '' });
    const parents = FIN.L.categories.filter(function (x) { return x.kind === kind && !x.parent_id && x.id !== c.id; });
    const parent = FIN.selectEl(parents.map(function (x) { return { value: x.id, label: x.name }; }), c.parent_id || parentId || '', '— Là danh mục chính —');
    const hasKids = c.id && FIN.L.categories.some(function (x) { return x.parent_id === c.id; });
    if (hasKids) parent.disabled = true;
    const active = h('input', { type: 'checkbox', checked: c.id ? c.is_active : true });
    BZ.modal({ title: c.id ? 'Sửa danh mục' : (kind === 'income' ? 'Thêm danh mục thu' : 'Thêm danh mục chi'), body: h('div', { style: { display: 'grid', gap: '14px' } },
      BZ.field('Tên danh mục *', name), BZ.field('Thuộc nhóm', parent),
      c.id ? h('label', { class: 'check' }, active, ' Đang dùng (bỏ chọn để ẩn khi lập phiếu, số liệu cũ vẫn giữ)') : null,
      c.id ? h('p', { class: 'muted', style: { fontSize: '13px' } }, 'Mã: ' + c.code) : null),
      actions: [{ label: 'Hủy', kind: 'ghost' }, { label: 'Lưu', kind: 'primary', onClick: async function (close, msg) {
        if (name.value.trim().length < 2) { msg.textContent = 'Nhập tên danh mục.'; msg.hidden = false; return; }
        const pr = parent.value ? FIN.L.byId[parent.value] : null;
        const row = { name: name.value.trim(), parent_id: parent.value || null, is_active: active.checked };
        let r;
        if (c.id) r = await sb.from('finance_categories').update(row).eq('id', c.id);
        else {
          const sib = FIN.L.categories.filter(function (x) { return x.kind === kind && (x.parent_id || null) === (row.parent_id || null); });
          r = await sb.from('finance_categories').insert(Object.assign(row, { kind: kind, code: codeFrom(row.name, pr && pr.code, kind), sort_order: sib.reduce(function (m, x) { return Math.max(m, x.sort_order || 0); }, 0) + 10 }));
        }
        if (r.error) throw r.error;
        close(); BZ.toast('Đã lưu danh mục.', 'ok'); refresh();
      } }] });
  }
  function loadCategories() {
    const p = panes.categories; p.textContent = '';
    p.appendChild(h('p', { class: 'muted', style: { fontSize: '13px', margin: '14px 0' } }, 'Danh mục dùng khi lập phiếu và để tổng hợp báo cáo. Nên ghi phiếu vào danh mục con cho chi tiết; không xóa danh mục đã dùng, chỉ ngưng sử dụng.'));
    p.appendChild(h('div', { class: 'grid2', style: { gridTemplateColumns: '1fr 1fr' } }, ['expense', 'income'].map(function (kind) {
      const roots = FIN.L.categories.filter(function (c) { return c.kind === kind && !c.parent_id; });
      function line(c, child) {
        return h('li', { style: { paddingLeft: child ? '22px' : '0', opacity: c.is_active ? '1' : '.5' } },
          h('span', null, child ? c.name : h('b', { style: { fontFamily: 'var(--font)' } }, c.name), c.is_active ? null : ' (ngưng)'),
          can ? h('span', { class: 'row-actions' },
            !child ? h('button', { type: 'button', class: 'link-btn', style: { fontSize: '13px' }, onclick: function () { categoryForm(null, kind, c.id); } }, '+ Mục con') : null,
            h('button', { type: 'button', class: 'link-btn', style: { fontSize: '13px' }, onclick: function () { categoryForm(c); } }, 'Sửa')) : null);
      }
      return h('div', null, h('div', { class: 'card-h' }, h('h2', null, kind === 'expense' ? 'Danh mục chi' : 'Danh mục thu'),
        can ? h('button', { type: 'button', class: 'btn btn-ghost btn-sm', onclick: function () { categoryForm(null, kind); } }, '+ Nhóm mới') : null),
        h('ul', { class: 'list-plain' }, roots.map(function (r) {
          return [line(r, false)].concat(FIN.L.categories.filter(function (c) { return c.parent_id === r.id; }).map(function (c) { return line(c, true); }));
        })));
    })));
  }

  /* ================= Mảng / bộ phận ================= */
  function centerForm(c) {
    c = c || {};
    const name = h('input', { type: 'text', maxlength: '150', value: c.name || '' });
    const code = h('input', { type: 'text', maxlength: '40', value: c.code || '', placeholder: 'VD: SKYAGENT' });
    const type = FIN.selectEl(Object.keys(FIN.CENTER_TYPE).map(function (k) { return { value: k, label: FIN.CENTER_TYPE[k] }; }), c.center_type || 'product');
    const active = h('input', { type: 'checkbox', checked: c.id ? c.is_active : true });
    BZ.modal({ title: c.id ? 'Sửa mảng' : 'Thêm mảng / bộ phận', body: h('div', { class: 'form-grid' },
      h('div', { class: 'span2' }, BZ.field('Tên *', name)), BZ.field('Loại', type), BZ.field('Mã *', code, 'Chữ không dấu, số, dấu gạch'),
      c.id ? h('label', { class: 'span2 check' }, active, ' Đang dùng') : null),
      actions: [{ label: 'Hủy', kind: 'ghost' }, { label: 'Lưu', kind: 'primary', onClick: async function (close, msg) {
        const cd = code.value.trim().toUpperCase();
        if (name.value.trim().length < 2 || !/^[A-Za-z0-9._-]{2,40}$/.test(cd)) { msg.textContent = 'Nhập tên và mã hợp lệ (mã 2–40 ký tự, không dấu, không khoảng trắng).'; msg.hidden = false; return; }
        const row = { name: name.value.trim(), code: cd, center_type: type.value, is_active: active.checked };
        const r = c.id ? await sb.from('finance_cost_centers').update(row).eq('id', c.id) : await sb.from('finance_cost_centers').insert(row);
        if (r.error) throw r.error;
        close(); BZ.toast('Đã lưu.', 'ok'); refresh();
      } }] });
  }
  function loadCenters() {
    const p = panes.centers; p.textContent = '';
    p.append(h('div', { class: 'toolbar', style: { margin: '14px 0', justifyContent: 'space-between' } },
      h('p', { class: 'muted', style: { fontSize: '13px' } }, 'Khi lập phiếu, chọn "Tính vào" một mảng để xem thu – chi và lãi lỗ riêng từng sản phẩm, bộ phận hay chiến dịch.'),
      can ? h('button', { type: 'button', class: 'btn btn-primary btn-sm', onclick: function () { centerForm(); } }, '+ Thêm') : null),
      h('div', { class: 'table-wrap' }, h('table', { class: 't', style: { minWidth: '0' } },
        h('thead', null, h('tr', null, h('th', null, 'Tên'), h('th', null, 'Mã'), h('th', null, 'Loại'), h('th'))),
        h('tbody', null, FIN.L.centers.length ? FIN.L.centers.map(function (c) {
          return h('tr', { style: c.is_active ? null : { opacity: '.55' } }, h('td', null, h('b', null, c.name), c.is_active ? null : h('small', null, 'Ngưng')), h('td', null, c.code), h('td', null, FIN.CENTER_TYPE[c.center_type]),
            h('td', null, can ? h('button', { type: 'button', class: 'btn btn-ghost btn-sm', onclick: function () { centerForm(c); } }, 'Sửa') : null));
        }) : BZ.emptyRow(4, 'Chưa có mảng nào.')))));
  }

  const k = location.hash.slice(1);
  show(TABS.some(function (t) { return t.k === k; }) ? k : 'budgets');
});
</script>
